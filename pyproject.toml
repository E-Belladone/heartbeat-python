[project]
name = "heartbeat-beacon"
version = "0.1.0"
description = "A self-hosted Tailscale presence beacon: a poller + a privacy proxy that serves an aggregates-only public presence signal."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
    "websockets>=14",
]

[project.scripts]
heartbeat-poller = "heartbeat.poller.main:main"
heartbeat-proxy = "heartbeat.proxy.app:main"
heartbeat-ingest = "heartbeat.ingest.app:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartbeat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
